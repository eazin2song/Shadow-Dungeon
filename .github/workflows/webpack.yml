name: NodeJS with Webpack

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Build
      run: |
        # Use a deterministic install when package-lock.json exists, fall back to npm install
        if [ -f package-lock.json ]; then npm ci; else npm install; fi
        # Ensure webpack-cli is available in CI so npx won't prompt interactively
        npm install --no-audit --no-fund --save-dev webpack-cli
        # Prefer running project's build script if present, otherwise fall back to npx webpack
        if npm run --silent | grep -q "build"; then
          npm run build
        else
          npx webpack --mode production
        fi
