<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>暗影地牢 - Shadow Dungeon</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <header id="game-header">
            <div class="header-left">
                <h1>暗影地牢</h1>
                <span id="floor-display">第1层</span>
            </div>
            <div class="header-center">
                <div class="hp-bar-container">
                    <div id="hp-bar" class="hp-bar"></div>
                    <span id="hp-text">50/50</span>
                </div>
            </div>
            <div class="header-right">
                <span id="level-display">Lv.1</span>
                <span id="gold-display">💰 0</span>
            </div>
        </header>

        <div id="game-main">
            <div id="canvas-container">
                <canvas id="game-canvas"></canvas>
            </div>
            <div id="side-panel">
                <div id="stats-panel" class="panel">
                    <h3>角色信息</h3>
                    <div id="stats-content"></div>
                </div>
                <div id="enemy-panel" class="panel hidden">
                    <h3>敌人信息</h3>
                    <div id="enemy-content"></div>
                </div>
                <div id="log-panel" class="panel">
                    <h3>战斗日志</h3>
                    <div id="log-content"></div>
                </div>
            </div>
        </div>

        <footer id="game-footer">
            <div id="action-buttons" class="button-group">
                <button id="btn-attack" class="action-btn">⚔️ 攻击</button>
                <button id="btn-defend" class="action-btn">🛡️ 防御</button>
                <button id="btn-item" class="action-btn">🧪 道具</button>
                <button id="btn-flee" class="action-btn">🏃 逃跑</button>
            </div>
            <div id="menu-buttons" class="button-group">
                <button id="btn-shop" class="menu-btn shop-btn">🏪 商店</button>
                <button id="btn-inventory" class="menu-btn">📦 背包</button>
                <button id="btn-equipment" class="menu-btn">⚔️ 装备</button>
                <button id="btn-skill" class="menu-btn">🌟 技能</button>
                <button id="btn-enhance" class="menu-btn">⚒️ 强化</button>
                <button id="btn-achievements" class="menu-btn">🏆 成就</button>
                <button id="btn-pause" class="menu-btn">⏸️ 暂停</button>
            </div>
        </footer>
    </div>

    <div id="overlay" class="hidden">
        <div id="overlay-content"></div>
    </div>

    <div id="menu-screen">
        <canvas id="menu-canvas"></canvas>
        <div class="menu-overlay"></div>
        <div class="menu-box">
            <div class="menu-logo">
                <div class="logo-icon">⚔️</div>
                <h1 class="menu-title">暗影地牢</h1>
                <p class="menu-subtitle">Shadow Dungeon</p>
                <div class="menu-tagline">探索无尽的地牢，成为传说中的冒险者</div>
            </div>
            <div class="menu-stats">
                <div class="stat-item">
                    <span class="stat-icon">🏰</span>
                    <span class="stat-text">无限层数</span>
                </div>
                <div class="stat-item">
                    <span class="stat-icon">🎭</span>
                    <span class="stat-text">12种职业</span>
                </div>
                <div class="stat-item">
                    <span class="stat-icon">⚔️</span>
                    <span class="stat-text">元素战斗</span>
                </div>
                <div class="stat-item">
                    <span class="stat-icon">🏆</span>
                    <span class="stat-text">成就系统</span>
                </div>
            </div>
            <div class="menu-options">
                <button id="btn-new-game" class="menu-main-btn">
                    <span class="btn-icon">🗡️</span>
                    <span class="btn-text">新游戏</span>
                </button>
                <button id="btn-continue" class="menu-main-btn">
                    <span class="btn-icon">📜</span>
                    <span class="btn-text">继续游戏</span>
                </button>
                <button id="btn-multiplayer" class="menu-main-btn multiplayer-btn">
                    <span class="btn-icon">🌐</span>
                    <span class="btn-text">联机模式</span>
                </button>
                <button id="btn-leaderboard" class="menu-main-btn">
                    <span class="btn-icon">🏆</span>
                    <span class="btn-text">排行榜</span>
                </button>
            </div>
            <div class="menu-footer">
                <div class="version">v1.0</div>
                <div class="controls-hint">WASD移动 | 空格交互 | ESC暂停</div>
            </div>
        </div>
    </div>

    <div id="multiplayer-panel" class="hidden">
        <div class="mp-panel-content">
            <div class="mp-header">
                <h2>🌐 联机模式</h2>
                <button class="mp-close" onclick="Multiplayer.closePanel()">✕</button>
            </div>
            <div class="mp-tabs">
                <button class="mp-tab active" onclick="Multiplayer.showTab('lobby')">大厅</button>
                <button class="mp-tab" onclick="Multiplayer.showTab('create')">创建房间</button>
                <button class="mp-tab" onclick="Multiplayer.showTab('join')">加入房间</button>
            </div>
            <div id="mp-content-lobby" class="mp-tab-content">
                <div class="mp-room-list">
                    <div class="mp-no-rooms">暂无房间，创建一个吧！</div>
                </div>
                <button class="mp-refresh-btn" onclick="Multiplayer.refreshRooms()">🔄 刷新</button>
            </div>
            <div id="mp-content-create" class="mp-tab-content hidden">
                <div class="mp-form">
                    <label>房间名称</label>
                    <input type="text" id="mp-room-name" placeholder="输入房间名称" value="冒险者的房间">
                    <label>最大人数</label>
                    <select id="mp-max-players">
                        <option value="2">2人</option>
                        <option value="3">3人</option>
                        <option value="4" selected>4人</option>
                    </select>
                    <button class="mp-create-btn" onclick="Multiplayer.createRoom()">创建房间</button>
                </div>
            </div>
            <div id="mp-content-join" class="mp-tab-content hidden">
                <div class="mp-form">
                    <label>房间ID</label>
                    <input type="text" id="mp-room-id" placeholder="输入房间ID">
                    <button class="mp-join-btn" onclick="Multiplayer.joinRoomById()">加入房间</button>
                </div>
            </div>
        </div>
    </div>

    <div id="room-panel" class="hidden">
        <div class="room-panel-content">
            <div class="room-header">
                <h2 id="room-title">房间</h2>
                <button class="mp-close" onclick="Multiplayer.leaveRoom()">离开</button>
            </div>
            <div class="room-info-bar">
                <span>房间ID: <strong id="room-id-display">-</strong></span>
                <button class="copy-btn" onclick="navigator.clipboard.writeText(document.getElementById('room-id-display').textContent).then(()=>UI.showToast('已复制','success'))">复制</button>
            </div>
            <div class="room-players" id="room-players"></div>
            <div class="room-chat">
                <div class="chat-messages" id="chat-messages"></div>
                <div class="chat-input">
                    <input type="text" id="chat-input" placeholder="输入消息..." onkeypress="if(event.key==='Enter')Multiplayer.sendChat()">
                    <button onclick="Multiplayer.sendChat()">发送</button>
                </div>
            </div>
            <div class="room-actions">
                <button id="btn-ready" class="room-btn" onclick="Multiplayer.toggleReady()">准备</button>
                <button id="btn-start" class="room-btn start-btn hidden" onclick="Multiplayer.startGame()">开始游戏</button>
            </div>
        </div>
    </div>

    <div id="toast" class="hidden"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <script src="js/core.js"></script>
    <script src="js/game.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/multiplayer.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
